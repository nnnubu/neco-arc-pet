<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌面歌词</title>
  <link rel="stylesheet" href="lyric.css">
</head>
<body>
  <div id="bar">
    <div id="title"></div>
    <div id="prev"></div>
    <div id="cur"></div>
    <div id="next"></div>
    <!-- 播放控制行（hover 显示）：上一首/暂停 + 时间 + 可拖动进度条 + 下一首 -->
    <div id="controls">
      <button id="lcPrev" title="上一首" data-i18n-title="lyricPrev">⏮</button>
      <button id="lcToggle" title="播放/暂停" data-i18n-title="lyricToggle">⏸</button>
      <span id="progressTime">00:00 / 00:00</span>
      <div id="progress">
        <div id="progressFill"></div>
        <div id="progressKnob"></div>
      </div>
      <button id="lcNext" title="下一首" data-i18n-title="lyricNext">⏭</button>
    </div>
  </div>
  <button id="lyricClose" title="关闭歌词" data-i18n-title="lyricCloseTitle">×</button>
  <button id="lyricLock" title="锁定歌词：点击后鼠标穿透下层，歌词纯展示；再点解锁恢复操作" data-i18n-title="lyricLockTitle">
    <svg id="lockSvg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M5 8V6a3 3 0 0 1 6 0"/>
      <rect x="3" y="8" width="10" height="7" rx="1.6"/>
    </svg>
  </button>
  <script src="i18n.js"></script>
  <script src="lyric-render.js"></script>
</body>
</html>
