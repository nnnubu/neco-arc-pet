<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 设置</title>
  <link rel="stylesheet" href="ai-config.css">
</head>
<body>
  <!-- 自绘标题栏：可拖动 + 最小化/关闭 -->
  <div id="titlebar">
    <span class="t">⚙ AI 设置</span>
    <div id="tbBtns">
      <button id="btnMin" title="最小化">—</button>
      <button id="btnClose" title="关闭">×</button>
    </div>
  </div>

  <div id="body">
    <label class="field">
      <span>API 密钥</span>
      <div id="keyRow">
        <input id="inKey" type="password" placeholder="sk-…" autocomplete="off">
        <button id="btnKeyEye" type="button" title="显示/隐藏密钥">👁</button>
      </div>
    </label>
    <label class="field">
      <span>接口地址（Base URL）</span>
      <input id="inBase" type="text" placeholder="https://api.siliconflow.cn/v1">
    </label>
    <label class="field">
      <span>模型</span>
      <input id="inModel" type="text" placeholder="Qwen/Qwen2.5-7B-Instruct">
    </label>
    <div id="row2">
      <label class="field half">
        <span>温度（0~2）</span>
        <input id="inTemp" type="number" min="0" max="2" step="0.1" value="0.7">
      </label>
      <label class="field half">
        <span>最大回复字数</span>
        <input id="inMax" type="number" min="32" max="2048" step="32" value="256">
      </label>
    </div>
    <label class="field">
      <span>角色提示词（system prompt）</span>
      <textarea id="inPrompt" rows="4" spellcheck="false"></textarea>
    </label>

    <div class="divider"></div>
    <div class="section-title">主动说话</div>
    <label class="field check" id="lblProactive">
      <input id="inProactive" type="checkbox">
      <span>让桌宠定时主动找你搭话</span>
    </label>
    <label class="field" id="lblInterval">
      <span>说话间隔（分钟，5~240）</span>
      <input id="inInterval" type="number" min="5" max="240" step="5" value="30">
    </label>
    <label class="field">
      <span>主动搭话指令（喂给 AI，可自定义）</span>
      <textarea id="inProactivePrompt" rows="2" spellcheck="false" placeholder="主动找人类搭一句话：简短一句，用猫姬人设，直接输出台词不要解释"></textarea>
    </label>
  </div>

  <!-- 底部固定：提示消息 + 操作按钮 + 说明，不随表单滚动，始终可见 -->
  <div id="footer">
    <div id="msg"></div>

    <div id="btns">
      <button id="btnTest" title="用当前表单值发一条测试消息验证">测试连接</button>
      <button id="btnDefault" title="提示词恢复猫姬默认人设">恢复默认</button>
      <button id="btnProactiveNow" title="立即让桌宠主动说一句（不依赖定时）">立即说一句</button>
      <button id="btnSave" class="primary">保存</button>
    </div>
    <p id="hint">保存后立即生效；密钥等敏感信息仅存本项目 assets/ai-config.json（不提交 git）</p>
  </div>

  <script src="ai-config.js"></script>
</body>
</html>
