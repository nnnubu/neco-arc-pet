<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 设置</title>
  <link rel="stylesheet" href="ai-config.css">
</head>
<body>
  <!-- 自绘标题栏：可拖动 + 最小化/关闭 -->
  <div id="titlebar">
    <span class="t" data-i18n="aiTitle">⚙ AI 设置</span>
    <div id="tbBtns">
      <button id="btnMin" title="最小化" data-i18n-title="btnMin">—</button>
      <button id="btnMax" title="最大化" data-i18n-title="btnMax">⛶</button>
      <button id="btnClose" title="关闭" data-i18n-title="btnClose">×</button>
    </div>
  </div>

  <div id="body">
    <div id="colLeft">
      <!-- 界面语言独占一行 -->
      <label class="field">
        <span data-i18n="lblLang">界面语言</span>
        <select id="inLang">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <!-- 文本生成模型组：模型 + 密钥并列，接口地址单独一行（与语音/嵌入组格式完全一致） -->
      <div class="row">
        <label class="field half">
          <span data-i18n="lblModel">文本生成模型</span>
          <input id="inModel" type="text" placeholder="模型名称">
        </label>
        <label class="field half">
          <span data-i18n="lblKey">文本 API 密钥</span>
          <div id="keyRow">
            <input id="inKey" type="password" placeholder="请输入 API 密钥" autocomplete="off">
            <button id="btnKeyEye" type="button" title="显示/隐藏密钥" data-i18n-title="keyEyeTitle">👁</button>
          </div>
        </label>
      </div>
      <label class="field">
        <span data-i18n="lblBase">文本接口地址（Base URL）</span>
        <input id="inBase" type="text" placeholder="https://…">
      </label>
      <div id="row2">
        <label class="field half">
          <span data-i18n="lblTemp">温度（0~2）</span>
          <input id="inTemp" type="number" min="0" max="2" step="0.1" value="0.7">
        </label>
        <label class="field half">
          <span data-i18n="lblMax">最大回复字数</span>
          <input id="inMax" type="number" min="32" max="2048" step="32" value="256">
        </label>
      </div>

      <!-- 语音合成模型区：与文本生成模型并列（结构对称）；未安装语音扩展包时整区隐藏 -->
      <div id="ttsSection">
        <div class="divider"></div>
        <div class="row">
          <label class="field half">
            <span data-i18n="lblTtsModel">语音合成模型</span>
            <input id="inTtsModel" type="text" autocomplete="off">
          </label>
          <label class="field half">
            <span data-i18n="lblTtsKey">语音 API 密钥</span>
            <div id="ttsKeyRow">
              <input id="inTtsKey" type="password" autocomplete="off">
              <button id="btnTtsKeyEye" type="button" title="显示/隐藏密钥" data-i18n-title="keyEyeTitle">👁</button>
            </div>
          </label>
        </div>
        <label class="field">
          <span data-i18n="lblTtsBase">语音接口地址</span>
          <input id="inTtsBase" type="text" autocomplete="off">
        </label>
        <label class="field check" id="lblEdgeFallback">
          <input id="inEdgeFallback" type="checkbox" checked>
          <span data-i18n="lblEdgeFallback">指定模型失败时自动用免费兜底（Edge TTS / 系统语音）</span>
        </label>
      </div>

      <!-- 知识库（RAG）区：与文本/语音模型并列（结构对称）；嵌入三字段用户指定，未配置自动用本地关键词检索兜底 -->
      <div id="kbSection">
        <div class="divider"></div>
        <div class="row">
          <label class="field half">
            <span data-i18n="lblKbModel">嵌入模型</span>
            <input id="inKbModel" type="text" autocomplete="off">
          </label>
          <label class="field half">
            <span data-i18n="lblKbKey">嵌入 API 密钥</span>
            <div id="kbKeyRow">
              <input id="inKbKey" type="password" autocomplete="off">
              <button id="btnKbKeyEye" type="button" title="显示/隐藏密钥" data-i18n-title="keyEyeTitle">👁</button>
            </div>
          </label>
        </div>
        <label class="field">
          <span data-i18n="lblKbBase">嵌入接口地址</span>
          <input id="inKbBase" type="text" autocomplete="off">
        </label>
        <label class="field">
          <span data-i18n="lblKbMode">触发方式</span>
          <select id="inKbMode">
            <option value="auto" data-i18n="optKbAuto">智能判断（内置词表：身份/口癖/招式/关系等才检索）</option>
            <option value="always" data-i18n="optKbAlways">总是检索（每条消息都查知识库）</option>
            <option value="custom" data-i18n="optKbCustom">自定义关键词（按下方填写的词触发）</option>
          </select>
        </label>
        <label class="field hidden" id="lblKbWords">
          <span data-i18n="lblKbWords">触发关键词（逗号分隔；问题含任一词即检索知识库）</span>
          <input id="inKbWords" type="text" autocomplete="off">
        </label>
        <div class="divider"></div>
      </div>

      <div class="divider"></div>
      <div class="section-title" data-i18n="secSearch">联网搜索</div>
      <label class="field">
        <span data-i18n="lblSearchMode">触发方式（总开关在对话窗 🌐）</span>
        <select id="inSearchMode">
          <option value="auto" data-i18n="optAuto">智能判断（内置规则：疑问句+时效/信息词才搜索）</option>
          <option value="always" data-i18n="optAlways">总是搜索（每条消息都联网检索）</option>
          <option value="custom" data-i18n="optCustom">自定义关键词（按下方填写的词触发）</option>
        </select>
      </label>
      <label class="field hidden" id="lblSearchWords">
        <span data-i18n="lblSearchWords">触发关键词（逗号分隔；问题含任一词即联网搜索）</span>
        <input id="inSearchWords" type="text" placeholder="例如：今天天气, 最新, 价格, 新闻, 汇率" data-i18n-ph="searchWordsPh" />
      </label>
    </div>

    <div id="colRight">
      <!-- 角色提示词：整块移到右列顶部（主动说话标题之上） -->
      <label class="field">
        <span data-i18n="lblPrompt">角色提示词（system prompt）</span>
        <textarea id="inPrompt" rows="7" spellcheck="false"></textarea>
      </label>

      <div class="divider"></div>
      <div class="section-title" data-i18n="secProactive">主动说话</div>
      <label class="field check" id="lblProactive">
        <input id="inProactive" type="checkbox">
        <span data-i18n="lblProactive">让桌宠定时主动找你搭话</span>
      </label>
      <label class="field">
        <span data-i18n="lblInterval">说话间隔（分钟，5~240）</span>
        <input id="inInterval" type="number" min="5" max="240" step="5" value="30">
      </label>
      <label class="field">
        <span data-i18n="lblProactivePrompt">主动搭话指令（喂给 AI，可自定义）</span>
        <textarea id="inProactivePrompt" rows="6" spellcheck="false" placeholder="主动找人类搭一句话：简短一句，用猫姬人设，直接输出台词不要解释" data-i18n-ph="proactivePh"></textarea>
      </label>

      <div class="divider"></div>
      <div class="section-title" data-i18n="secRandVoice">随机发声</div>
      <label class="field check" id="lblRandVoice">
        <input id="inRandVoice" type="checkbox">
        <span data-i18n="lblRandVoice">偶尔用语音素材主动叫一声</span>
      </label>
      <div id="rvRow">
        <label class="field half">
          <span data-i18n="lblRvMin">最短间隔（分钟）</span>
          <input id="inRvMin" type="number" min="1" max="120" step="1" value="3">
        </label>
        <label class="field half">
          <span data-i18n="lblRvMax">最长间隔（分钟）</span>
          <input id="inRvMax" type="number" min="1" max="120" step="1" value="8">
        </label>
      </div>

      <div class="divider"></div>
      <div class="section-title" data-i18n="secMute">静音模式</div>
      <label class="field check" id="lblMute">
        <input id="inMute" type="checkbox">
        <span data-i18n="lblMute">让 arc 安静（AI 语音/随机发声静音，翻唱音乐不受影响）</span>
      </label>
    </div>
  </div>

  <!-- 底部固定：提示消息 + 操作按钮 + 说明，不随表单滚动，始终可见 -->
  <div id="footer">
    <div id="msg"></div>

    <!-- 第一行：四个测试按钮（文本/语音模型/免费兜底/嵌入模型各自独立测试） -->
    <div id="btns">
      <button id="btnTest" title="用当前文本生成配置发一条测试消息验证" data-i18n-title="btnTestTitle" data-i18n="btnTest">测试文本模型</button>
      <button id="btnTestCosy" title="用当前语音合成模型 ID 合成一句测试" data-i18n-title="btnTestCosy" data-i18n="btnTestCosy">测试语音模型</button>
      <button id="btnTestEdge" title="测试微软语音兜底链路（Edge TTS / 系统语音）" data-i18n-title="btnTestEdgeTitle" data-i18n="btnTestEdge">测试微软语音模型</button>
      <button id="btnTestKb" title="用当前嵌入模型配置生成一句向量测试" data-i18n-title="btnTestKb" data-i18n="btnTestKb">测试嵌入模型</button>
    </div>
    <!-- 第二行：其余操作按钮 -->
    <div id="btns2">
      <button id="btnDefault" title="提示词恢复猫姬默认人设" data-i18n-title="btnDefault" data-i18n="btnDefault">恢复默认</button>
      <button id="btnProactiveNow" title="立即让桌宠主动说一句（不依赖定时）" data-i18n-title="btnProactiveNow" data-i18n="btnProactiveNow">立即说一句</button>
      <button id="btnSave" class="primary" data-i18n="btnSave">保存</button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="ai-config.js"></script>
</body>
</html>
