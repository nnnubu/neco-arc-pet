<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>猫姬动作</title>
  <link rel="stylesheet" href="action-panel.css">
</head>
<body>
  <!-- 自绘标题栏：可拖动 + 最小化/关闭 -->
  <div id="titlebar">
    <span class="t" data-i18n="actTitle">✦ 猫姬动作</span>
    <div id="tbBtns">
      <button id="btnMin" title="最小化" data-i18n-title="btnMin">—</button>
      <button id="btnMax" title="最大化" data-i18n-title="btnMax">⛶</button>
      <button id="btnClose" title="关闭" data-i18n-title="btnClose">×</button>
    </div>
  </div>

  <div id="scroller">
    <!-- 动作设置：随机表演开关 + 表演间隔区间 + 趴下/站起 + 重置（原右键菜单设置区并入动作模块） -->
    <div id="cfgCard">
      <div class="cfg-title" data-i18n="actCfgTitle">动作设置</div>
      <div class="cfg-row">
        <span class="cfg-name" data-i18n="actRandom">随机表演</span>
        <button class="cfg-btn" id="cfgToggle">开</button>
      </div>
      <div class="cfg-row">
        <span class="cfg-name" data-i18n="actInterval">表演间隔</span>
        <button class="cfg-step" id="cfgDecMin">−</button>
        <span class="cfg-val" id="cfgMin">10</span>
        <button class="cfg-step" id="cfgIncMin">＋</button>
        <span class="cfg-tilde">~</span>
        <button class="cfg-step" id="cfgDecMax">−</button>
        <span class="cfg-val" id="cfgMax">30</span>
        <button class="cfg-step" id="cfgIncMax">＋</button>
        <span class="cfg-unit" data-i18n="actSec">秒</span>
      </div>
      <div class="cfg-row cfg-acts">
        <button class="cfg-btn" id="cfgLie" data-i18n="actLie">趴下/站起</button>
        <button class="cfg-btn" id="cfgReset" data-i18n="actReset">重置动作</button>
      </div>
    </div>

    <!-- 全部动作按编号顺序平铺 -->
    <div id="all-items" class="items"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="action-panel.js"></script>
</body>
</html>
