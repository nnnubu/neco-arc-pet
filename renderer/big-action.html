<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>big action</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="../assets/vendor/pixi.min.js"></script>
<script>
  // 特殊大动作（48/49）独立播放页：帧按 scale 渲染（NEAREST 像素清晰），播完自动关闭窗口
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  const frames = parseInt(params.get('frames') || '1', 10);
  const scale = parseFloat(params.get('scale') || '2');

  // 位移配置（与 sprite.js MOVE_ACTIONS 一致）：act_49 帧 18 起向上平移
  const MOVE = { act_49: { fromFrame: 18, speed: 120 } };

  (async () => {
    const app = new PIXI.Application({
      backgroundAlpha: 0,
      antialias: false,
      resolution: 1,
      autoDensity: false,
    });
    document.body.appendChild(app.view);

    const texs = [];
    for (let i = 1; i <= frames; i++) {
      texs.push(await PIXI.Assets.load(`../assets/sprite/animations/${name}/${i}.png`));
    }
    const s = new PIXI.AnimatedSprite(texs);
    s.anchor.set(0.5, 1);
    s.animationSpeed = 12 / 60; // 12fps 与桌宠一致
    s.scale.set(scale, scale);
    for (const t of texs) t.baseTexture.scaleMode = PIXI.SCALE_MODES.NEAREST;
    app.stage.addChild(s);

    // 渲染器跟随窗口（big-action 窗口已按帧×scale 建好）
    app.renderer.resize(window.innerWidth, window.innerHeight);
    s.position.set(window.innerWidth / 2, window.innerHeight - 2);

    // 位移：帧到指定位置后持续向上平移窗口（act_49 点火段起，直到动作结束）
    const mv = MOVE[name];
    app.ticker.add(() => {
      if (!mv) return;
      if (s.currentFrame >= mv.fromFrame) {
        window.pet.bigMoveBy(0, -Math.round(mv.speed * app.ticker.deltaMS / 1000));
      }
    });

    s.onComplete = () => {
      // 播放完保持最后一帧片刻再关闭（避免突兀）
      setTimeout(() => window.pet.bigClose(), 400);
    };
    s.loop = false;
    s.gotoAndPlay(0);
  })();
</script>
</body>
</html>
