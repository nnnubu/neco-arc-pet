<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>猫姬语音升级</title>
<link rel="stylesheet" href="upgrade.css">
</head>
<body>
  <header id="head">
    <div class="title" data-i18n="upgradeTitle">安装语音扩展包</div>
    <button id="btnClose" title="关闭">✕</button>
  </header>
  <div id="upDrop" class="up-drop">
    <div class="up-drop-ic">📦</div>
    <div class="up-drop-hint" data-i18n="upgradeDropHint">拖拽 .zip 语音扩展包到这里，或点击选择文件</div>
  </div>
  <div id="upProgress" class="up-progress" hidden>
    <div class="up-bar"><div id="upFill"></div></div>
    <div id="upStage" class="up-stage"></div>
  </div>
  <div id="upErr" class="up-err" hidden></div>
  <script src="i18n.js"></script>
  <script src="upgrade.js"></script>
</body>
</html>
