<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>猫姬语音升级</title>
<link rel="stylesheet" href="upgrade.css">
</head>
<body>
  <header id="head">
    <div class="title" id="upTitle">安装语音扩展包</div>
    <button id="btnClose" title="关闭">✕</button>
  </header>
  <!-- 未安装：拖拽/选择 zip 安装 -->
  <div id="upDrop" class="up-drop">
    <div id="upDropIc" class="up-drop-ic">📦</div>
    <div id="upDropHint" class="up-drop-hint" data-i18n="upgradeDropHint">拖拽 .zip 语音扩展包到这里，或点击选择文件</div>
    <div id="upDropBusy" class="up-drop-busy" hidden>
      <div class="spin"></div>
      <div id="upDropPct" class="up-drop-pct"></div>
    </div>
  </div>
  <div id="upProgress" class="up-progress" hidden>
    <div class="up-bar"><div id="upFill"></div></div>
    <div class="up-stage">
      <span id="upStage" class="up-stage-txt"></span>
      <span id="upPct" class="up-stage-pct"></span>
    </div>
  </div>
  <!-- 已安装：状态 + 卸载入口 -->
  <div id="upInstalled" hidden>
    <div class="up-inst-ic">🎤</div>
    <div id="upInstTxt" class="up-inst-txt" data-i18n="upgradeInstalled">已安装语音扩展包，桌宠聊天/翻唱/语音合成功能可用</div>
    <button id="btnUninstall" class="up-uninstall" data-i18n="upgradeUninstall">卸载语音扩展包</button>
    <div id="upUninstallBusy" class="up-uninstall-busy" hidden>
      <div class="spin small"></div>
      <span id="upUninstallTxt" data-i18n="upgradeUninstalling">正在卸载…完成将自动重启</span>
    </div>
  </div>
  <div id="upErr" class="up-err" hidden></div>
  <script src="i18n.js"></script>
  <script src="upgrade.js"></script>
</body>
</html>
