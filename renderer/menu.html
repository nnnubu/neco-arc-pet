<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>猫姬菜单</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div id="panel">
    <!-- 动作模块：常用动作 + 全部迁移分组 统合为一个模块（默认折叠） -->
    <details class="fgroup big">
      <summary>
        <span class="gtitle">动作</span>
        <span class="gcount" id="act-count">95</span>
        <span class="arrow">▶</span>
      </summary>
      <div class="sec-title">常用动作</div>
      <div class="sec-items" id="sec-fixed"></div>
      <div id="groups"></div>
    </details>

    <!-- 设置模块：随机播放参数（用户可手动调整，持久化） -->
    <details class="fgroup big" open>
      <summary>
        <span class="gtitle">设置</span>
        <span class="gcount" id="cfg-badge"></span>
        <span class="arrow">▶</span>
      </summary>
      <div id="cfg-box">
        <div class="item cfg" id="cfg-enable">
          <span class="fname">随机表演</span>
          <span class="cfg-val" id="cfg-enable-val">开</span>
        </div>
        <div class="item cfg-row">
          <span class="fname">表演间隔</span>
          <span class="cfg-op" id="cfg-dec">−</span>
          <span class="cfg-val" id="cfg-interval">15</span>
          <span class="cfg-unit">秒</span>
          <span class="cfg-op" id="cfg-inc">＋</span>
        </div>
      </div>
    </details>

    <!-- 底部功能 -->
    <div class="footer">
      <div class="item func" data-act="SPEAK"><span class="fname">说句话…</span></div>
      <div class="item func" data-act="RESET"><span class="fname">重置动作</span></div>
      <div class="item func danger" data-act="__quit__"><span class="fname">退出桌宠</span></div>
    </div>
  </div>
  <script src="menu.js"></script>
</body>
</html>
