<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>猫姬菜单</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div id="panel">
    <!-- 动作模块：入口打开独立动作面板（常驻窗口，可连续测试）+ 趴/站切换 -->
    <details class="fgroup big" open>
      <summary>
        <span class="gtitle">动作</span>
        <span class="arrow">▶</span>
      </summary>
      <div class="item func" data-act="ACTION_PANEL"><span class="fname">打开动作面板</span></div>
      <div class="item func" data-act="TOGGLE_LIE"><span class="fname">趴下 / 站起</span></div>
    </details>

    <!-- 设置模块：随机播放参数（用户可手动调整，持久化） -->
    <details class="fgroup big" open>
      <summary>
        <span class="gtitle">设置</span>
        <span class="gcount" id="cfg-badge"></span>
        <span class="arrow">▶</span>
      </summary>
      <div id="cfg-box">
        <div class="item cfg" id="cfg-enable">
          <span class="fname">随机表演</span>
          <span class="cfg-val" id="cfg-enable-val">开</span>
        </div>
        <div class="item cfg-row">
          <span class="fname">表演间隔</span>
          <span class="cfg-op" id="cfg-dec-min">−</span>
          <span class="cfg-val" id="cfg-min">10</span>
          <span class="cfg-unit">秒~</span>
          <span class="cfg-op" id="cfg-dec-max">−</span>
          <span class="cfg-val" id="cfg-max">30</span>
          <span class="cfg-unit">秒</span>
          <span class="cfg-op" id="cfg-inc-max">＋</span>
          <span class="cfg-op" id="cfg-inc-min">＋</span>
        </div>
        <div class="item func" data-act="AI_CONFIG"><span class="fname">AI 设置</span></div>
      </div>
    </details>

    <!-- 翻唱模块：入口打开独立翻唱面板（历史列表在面板内，不在菜单重复展示） -->
    <details class="fgroup big">
      <summary>
        <span class="gtitle">翻唱</span>
        <span class="arrow">▶</span>
      </summary>
      <div class="item func" data-act="SING_PANEL"><span class="fname">翻唱面板（拖拽音频）</span></div>
      <div class="item func" data-act="SING_DIR"><span class="fname">打开翻唱文件夹</span></div>
    </details>

    <!-- 语音模块：文本转语音面板（参数可调，保存到独立文件夹） -->
    <details class="fgroup big">
      <summary>
        <span class="gtitle">语音</span>
        <span class="arrow">▶</span>
      </summary>
      <div class="item func" data-act="TTS_PANEL"><span class="fname">语音面板（文本转语音）</span></div>
    </details>

    <!-- 底部功能 -->
    <div class="footer">
      <div class="item func" data-act="SPEAK"><span class="fname">说句话…</span></div>
      <div class="item func" data-act="RESET"><span class="fname">重置动作</span></div>
      <div class="item func danger" data-act="__quit__"><span class="fname">退出桌宠</span></div>
    </div>
  </div>
  <script src="menu.js"></script>
</body>
</html>
