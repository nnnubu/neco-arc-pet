<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Neco Arc 桌宠</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    #stage {
      position: fixed;
      inset: 0;
    }
    #stage canvas {
      display: block;
    }
    #petAudio { display: none; }
    #speakBar {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 10px;                 /* JS updatePosition 按脚底动态覆盖；此处为初始兜底 */
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 16px); /* 小窗口自适应收缩，不溢出 */
      /* 毛玻璃半透明：即使与角色轻微重叠也不会“遮住”视觉，桌宠底部仍可见 */
      background: linear-gradient(180deg, rgba(34, 34, 48, 0.66), rgba(20, 20, 30, 0.74));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 7px 9px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      z-index: 10;
      box-sizing: border-box;
    }
    #speakBar .row {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #speakInput {
      flex: 1 1 auto;
      min-width: 0;
      width: 138px;
      max-width: 172px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    #speakInput::placeholder { color: rgba(255, 255, 255, 0.42); }
    #speakInput:focus {
      border-color: rgba(255, 92, 98, 0.85);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 2px rgba(255, 92, 98, 0.16);
    }
    #speakSend {
      flex: 0 0 auto;
      min-width: 46px;
      background: linear-gradient(180deg, #ff5a60, #d93a42);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(217, 58, 66, 0.35);
      transition: filter 0.15s, transform 0.1s;
    }
    #speakSend:hover { filter: brightness(1.16); }
    #speakSend:active { transform: scale(0.95); }
    #speakRetry, #speakClose {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      line-height: 1;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #speakRetry:hover, #speakClose:hover { background: rgba(255, 255, 255, 0.22); }
    #speakStatus {
      display: none;
      color: #ffd9a0;
      font-size: 12px;
      margin-top: 5px;
      max-width: 270px;
      white-space: normal;
      line-height: 1.3;
    }
    /* AI 对话文本：透明底，跟随桌宠朝向显示在左右侧，不遮住桌宠本身 */
    #aiText {
      display: none;
      position: fixed;
      color: #ffe14d;
      font-weight: 700;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
      /* 黑色全向描边：透明底上保证可读且显眼 */
      text-shadow:
        2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000,
        0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
      z-index: 9;
      pointer-events: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <audio id="petAudio"></audio>
  <div id="aiText"></div>
  <div id="speakBar">
    <div class="row">
      <input id="speakInput" type="text" placeholder="说点什么…" maxlength="200" />
      <button id="speakSend">说</button>
      <button id="speakRetry" title="重新合成（绕过缓存）">↻</button>
      <button id="speakClose">×</button>
    </div>
    <div id="speakStatus"></div>
  </div>
  <script src="../assets/vendor/pixi.min.js"></script>
  <!-- 模块加载顺序：核心(精灵) → 交互 → 语音UI → 调试 → 入口装配 -->
  <script src="sprite.js"></script>
  <script src="controls.js"></script>
  <script src="voice-ui.js"></script>
  <script src="debug.js"></script>
  <script src="index.js"></script>
</body>
</html>
