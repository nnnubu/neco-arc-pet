<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Neco Arc 桌宠</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    #stage {
      position: fixed;
      inset: 0;
    }
    #stage canvas {
      display: block;
    }
    #petAudio { display: none; }
    #speakBar {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 6px;                 /* 固定贴窗口底，与桌宠脚底（h-6）间距恒定，不随缩放变化 */
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 12px); /* 小窗口自适应收缩，不溢出 */
      background: rgba(14, 14, 20, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      z-index: 10;
      box-sizing: border-box;
    }
    #speakBar .row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #speakInput {
      flex: 1 1 auto;
      min-width: 40px;
      width: 150px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }
    #speakInput::placeholder { color: rgba(255, 255, 255, 0.45); }
    #speakInput:focus { border-color: rgba(229, 73, 79, 0.8); }
    #speakSend {
      flex: 0 0 auto;
      background: linear-gradient(180deg, #e5494f, #c13a40);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 5px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #speakSend:hover { filter: brightness(1.12); }
    #speakClose {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 13px;
      cursor: pointer;
    }
    #speakClose:hover { background: rgba(255, 255, 255, 0.22); }
    #speakStatus {
      display: none;
      color: #ffd9a0;
      font-size: 12px;
      margin-top: 5px;
      max-width: 240px;
      white-space: normal;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <audio id="petAudio"></audio>
  <div id="speakBar">
    <div class="row">
      <input id="speakInput" type="text" placeholder="说点什么…" maxlength="200" />
      <button id="speakSend">说</button>
      <button id="speakClose">×</button>
    </div>
    <div id="speakStatus"></div>
  </div>
  <script src="../assets/vendor/pixi.min.js"></script>
  <!-- 模块加载顺序：核心(精灵) → 交互 → 语音UI → 调试 → 入口装配 -->
  <script src="sprite.js"></script>
  <script src="controls.js"></script>
  <script src="voice-ui.js"></script>
  <script src="debug.js"></script>
  <script src="index.js"></script>
</body>
</html>
