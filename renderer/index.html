<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Neco Arc 桌宠</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    #stage {
      position: fixed;
      inset: 0;
    }
    #stage canvas {
      display: block;
    }
    #petAudio, #singAudio { display: none; }
    /* AI 对话文本：透明底，跟随桌宠朝向显示在左右侧，不遮住桌宠本身 */
    #aiText {
      display: none;
      position: fixed;
      color: #ffe14d;
      font-weight: 700;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
      /* 显式中文字体栈：避免系统字体回退失败导致中文显示为黑色方块 */
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      /* 黑色全向描边：透明底上保证可读且显眼 */
      text-shadow:
        2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000,
        0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
      z-index: 9;
      pointer-events: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <audio id="petAudio"></audio>
  <audio id="singAudio"></audio>
  <div id="aiText"></div>
  <script src="../assets/vendor/pixi.min.js"></script>
  <!-- 模块加载顺序：核心(精灵) → 交互 → 语音播放 → 调试 → 入口装配 -->
  <script src="sprite.js"></script>
  <script src="controls.js"></script>
  <script src="voice-ui.js"></script>
  <script src="debug.js"></script>
  <script src="index.js"></script>
</body>
</html>
