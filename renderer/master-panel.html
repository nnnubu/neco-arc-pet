<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>猫姬总面板</title>
  <link rel="stylesheet" href="master-panel.css">
</head>
<body>
  <!-- 左侧导航列：标题（可拖动窗口）+ 模块按钮 + 底部最小化/关闭 -->
  <aside id="nav">
    <div id="navHead">
      <span class="logo">✦</span>
      <span id="navTitle" data-i18n="masterTitle">猫姬控制台</span>
    </div>
    <div id="navItems">
      <button class="nav-item" data-mod="chat" title="AI 对话" data-i18n-title="navChatTitle">
        <span class="ic">💬</span><span class="nm" data-i18n="navChat">对话</span>
      </button>
      <button class="nav-item" data-mod="sing" data-voice="1" title="翻唱面板" data-i18n-title="navSingTitle">
        <span class="ic">🎵</span><span class="nm" data-i18n="navSing">翻唱</span>
      </button>
      <button class="nav-item" data-mod="tts" data-voice="1" title="文本转语音" data-i18n-title="navTtsTitle">
        <span class="ic">🗣️</span><span class="nm" data-i18n="navTts">语音合成</span>
      </button>
      <button class="nav-item" data-mod="action" title="动作面板" data-i18n-title="navActionTitle">
        <span class="ic">🎬</span><span class="nm" data-i18n="navAction">动作</span>
      </button>
      <button class="nav-item" data-mod="ai" title="AI 设置" data-i18n-title="navAiTitle">
        <span class="ic">⚙️</span><span class="nm" data-i18n="navAi">AI 设置</span>
      </button>
    </div>
    <div id="navFoot">
      <!-- 最小化/关闭由窗口右上角控制按钮承担，底部保留：最大化/还原 + 退出桌宠（文字按钮） -->
      <button id="btnMax" title="最大化"></button>
      <button id="btnQuit" title="退出桌宠" data-i18n-title="btnQuit" data-i18n="btnQuit">退出桌宠</button>
      <!-- 语音升级入口：基础包（无语音包）时显示；拖拽/选择 zip 安装后自动重启 -->
      <button id="btnUpgrade" title="安装语音扩展包" data-i18n-title="btnUpgrade" data-i18n="btnUpgrade" hidden>语音升级</button>
      <div id="upgradeMsg" hidden></div>
    </div>
  </aside>

  <!-- 右侧内容区：WebContentsView 挂载（占位，view 叠加其上） -->
  <main id="content"></main>

  <script src="i18n.js"></script>
  <script src="master-panel.js"></script>
</body>
</html>
