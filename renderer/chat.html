<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>猫姬对话</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="win">
    <!-- 自绘标题栏：可拖动 + 右侧按钮 -->
    <div id="titlebar">
      <span class="dot"></span>
      <span id="titleText" data-i18n="chatTitle">猫姬对话</span>
      <div id="tbBtns">
        <button id="tbMute" title="静音：arc 不说话（翻唱音乐不受影响）" data-i18n-title="tbMuteOff">🔊</button>
        <button id="tbMin" title="最小化" data-i18n-title="btnMin">—</button>
        <button id="tbSing" title="打开翻唱面板" data-i18n-title="singOpenTitle">♪</button>
        <button id="tbClose" title="关闭" data-i18n-title="btnClose">×</button>
      </div>
    </div>

    <!-- 消息记录：用户右红 / 猫姬左浅 -->
    <div id="chatMsgs"></div>

    <!-- 当前翻唱播放提示（只读歌名；播放控制统一在翻唱面板，避免双端按钮状态不一致） -->
    <div id="nowPlaying" class="hidden">
      <span id="npIcon">♪</span>
      <span id="npName"></span>
    </div>

    <!-- 状态行（思考中/生成语音中/翻唱进度/错误） -->
    <div id="chatStatus"></div>

    <!-- 气泡显示设置（字号/文字颜色）：基础包无语音也可用；读 tts-config 同源 -->
    <div id="bubbleSettings" class="hidden">
      <span class="bs-name" data-i18n="bsSize">气泡字号</span>
      <input id="bsSize" type="range" min="12" max="50" step="1" value="16">
      <span id="bsSizeVal" class="bs-val">16</span>
      <span class="bs-unit">px</span>
      <span class="bs-name" data-i18n="bsColor">文字颜色</span>
      <span id="bsColorWrap">
        <button id="bsColorBtn" type="button" title="选择文字颜色"></button>
        <input id="bsColor" type="color" value="#ffd166">
      </span>
      <button id="bsReset" title="恢复默认字号 16px / 颜色 #ffd166" data-i18n-title="bubbleColorReset">↺</button>
    </div>

    <!-- 输入行：联网搜索开关 + 气泡设置 + 输入框 + 发送 + 回答缓存开关 + 清空缓存 -->
    <div id="inputRow">
      <button id="btnSearch" title="联网搜索（回答最新/实时信息时自动搜索增强）" data-i18n-title="searchTitleOff">🌐</button>
      <button id="btnBubble" title="气泡显示设置" data-i18n-title="bubbleTitle">Aa</button>
      <input id="chatInput" type="text" placeholder="说点什么喵…" maxlength="200" data-i18n-ph="chatPlaceholder" />
      <button id="btnSend" data-i18n="btnSend">发送</button>
      <button id="btnCache" title="缓存：开=同问同答直接返回，关=每次重新生成" data-i18n-title="cacheTitleOn">💾</button>
      <button id="btnCacheClear" title="清空回答缓存" data-i18n-title="cacheClearTitle">🗑️</button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="chat.js"></script>
</body>
</html>
