<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>猫姬语音</title>
  <link rel="stylesheet" href="tts-panel.css">
</head>
<body>
  <!-- 自绘标题栏：可拖动 + 最小化/关闭 -->
  <div id="titlebar">
    <span class="t">🎙 猫姬语音</span>
    <div id="tbBtns">
      <button id="btnMin" title="最小化">—</button>
      <button id="btnClose" title="关闭">×</button>
    </div>
  </div>

  <!-- 内容区（内部滚动，滚动条在内容区右侧，避免整页滚动右侧留白） -->
  <div id="scroller">
    <!-- 文本输入：弹性占满剩余高度，消除输入区下方空白 -->
    <div id="inputSec">
      <div class="sec-title">朗读文本</div>
      <textarea id="txtInput" placeholder="输入想让猫姬朗读的文本…" spellcheck="false"></textarea>
    </div>

    <!-- 音色参数：预设快捷 + f0/index/情绪 -->
    <div id="paramSec">
      <div class="sec-title">音色参数</div>
      <div id="presetRow">
        <button class="preset" data-f0="0" data-idx="0.75">V0 基线</button>
        <button class="preset" data-f0="1" data-idx="0.75">V1 升1半音</button>
        <button class="preset" data-f0="2" data-idx="0.75">V2 升2半音</button>
        <button class="preset" data-f0="0" data-idx="0.90">V3 贴模型</button>
        <button class="preset" data-f0="1" data-idx="0.90">V4 组合</button>
      </div>
      <div class="param-row">
        <span class="pname">音高偏移</span>
        <input id="f0Slider" type="range" min="-3" max="3" step="0.5" value="0">
        <span class="pval" id="f0Val">0</span>
        <span class="punit">半音</span>
      </div>
      <div class="param-row">
        <span class="pname">音色贴合</span>
        <input id="idxSlider" type="range" min="0.5" max="1" step="0.05" value="0.75">
        <span class="pval" id="idxVal">0.75</span>
      </div>
      <div class="param-row">
        <span class="pname">声线</span>
        <!-- 自定义下拉（深色玻璃，与面板统一；隐藏的原生 select 仅作 value 载体） -->
        <div class="cs" id="voiceWrap">
          <button type="button" class="cs-btn" id="voiceBtn" title="选择声线">
            <span id="voiceBtnText">随情绪默认</span>
            <span class="cs-arrow"></span>
          </button>
          <div class="cs-list hidden" id="voiceList">
            <div class="cs-item" data-v="">随情绪默认</div>
            <div class="cs-group">女声</div>
            <div class="cs-item" data-v="anna">anna（沉稳）</div>
            <div class="cs-item" data-v="bella">bella（热情）</div>
            <div class="cs-item" data-v="claire">claire（温柔）</div>
            <div class="cs-item" data-v="diana">diana（开朗）</div>
            <div class="cs-group">男声</div>
            <div class="cs-item" data-v="alex">alex（沉稳）</div>
            <div class="cs-item" data-v="benjamin">benjamin（深沉）</div>
            <div class="cs-item" data-v="charles">charles（磁性）</div>
            <div class="cs-item" data-v="david">david（开朗）</div>
          </div>
        </div>
        <select id="voiceSel" class="hidden-sel" tabindex="-1" aria-hidden="true">
          <option value="">随情绪默认</option>
          <optgroup label="女声">
            <option value="anna">anna（沉稳）</option>
            <option value="bella">bella（热情）</option>
            <option value="claire">claire（温柔）</option>
            <option value="diana">diana（开朗）</option>
          </optgroup>
          <optgroup label="男声">
            <option value="alex">alex（沉稳）</option>
            <option value="benjamin">benjamin（深沉）</option>
            <option value="charles">charles（磁性）</option>
            <option value="david">david（开朗）</option>
          </optgroup>
        </select>
      </div>
      <div class="param-row">
        <span class="pname">情绪</span>
        <span class="emotion-tag" id="emotionTag">平静自然</span>
        <span class="pval" id="emotionIntensity">（强度 50%）</span>
      </div>
      <div class="param-row">
        <span class="pname">效价</span>
        <span class="edge-label">难过</span>
        <input id="valenceSlider" type="range" min="-100" max="100" step="1" value="0">
        <span class="edge-label">开心</span>
        <span class="pval" id="valenceVal">0</span>
      </div>
      <div class="param-row">
        <span class="pname">活跃度</span>
        <span class="edge-label">平静</span>
        <input id="arousalSlider" type="range" min="0" max="100" step="1" value="50">
        <span class="edge-label">激烈</span>
        <span class="pval" id="arousalVal">50</span>
      </div>
      <div class="apply-row">
        <label class="chk"><input type="checkbox" id="chkApplyChat"><span class="box"></span>应用到聊天语音</label>
        <label class="chk"><input type="checkbox" id="chkApplySing"><span class="box"></span>应用到翻唱（音高/贴合）</label>
        <label class="chk"><input type="checkbox" id="chkMeowClips" checked><span class="box"></span>口癖用原版音频</label>
      </div>
      <div class="sec-title">显示设置</div>
      <div class="param-row">
        <span class="pname">气泡字号</span>
        <input id="bubbleSizeSlider" type="range" min="12" max="50" step="1" value="16">
        <span class="pval" id="bubbleSizeVal">16</span>
        <span class="punit">px</span>
      </div>
      <div class="param-row">
        <span class="pname">气泡颜色</span>
        <input id="bubbleColor" type="color" value="#ffd166">
        <button id="btnBubbleColorReset" class="mini-btn" title="恢复默认颜色（#ffd166）">↺</button>
        <span class="pval">文字主色</span>
      </div>
    </div>

    <!-- 生成 -->
    <div id="genRow">
      <button id="btnGen" disabled>生成语音</button>
    </div>
    <div id="statusText"></div>

    <!-- 播放控制 -->
    <div id="playRow" class="hidden">
      <button id="btnToggle" title="播放 / 暂停">⏸</button>
      <span id="playingName"></span>
      <button id="btnLyric" title="显示桌面歌词">♪</button>
      <!-- 播放进度条（仿歌词窗口样式，可拖动 seek） -->
      <div id="progWrap" title="拖动可跳转进度">
        <div id="prog"><div id="progFill"></div><div id="progKnob"></div></div>
        <span id="progTime">00:00 / 00:00</span>
      </div>
    </div>

    <!-- 历史 -->
    <div id="historyHead">
      <span>已生成</span>
      <button id="btnDir" title="打开语音文件夹">📂</button>
    </div>
    <div id="historyList"></div>
  </div>

  <script src="tts-panel.js"></script>
</body>
</html>
